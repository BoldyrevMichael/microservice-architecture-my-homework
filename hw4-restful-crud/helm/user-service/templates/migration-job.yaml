# Job неизменяема, поэтому на каждую ревизию релиза создаётся новая
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # ждать порт базы, чтобы JVM стартовала один раз, а не падала с перезапусками
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z {{ .Values.db.host }} {{ .Values.db.port }}; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: migrate
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: migrate
            {{- include "user-service.dbEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
