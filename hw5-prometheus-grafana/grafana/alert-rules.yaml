# правила алертов Grafana (unified alerting), подхватываются sidecar-ом из ConfigMap
apiVersion: 1
groups:
  - orgId: 1
    name: user-service
    folder: user-service
    interval: 30s
    rules:
      - uid: user-service-error-rate
        title: user-service — доля ответов 5xx выше 5 %
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Доля 5xx за 2 минуты: {{ $values.A }} %"
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 * sum(rate(http_server_requests_seconds_count{job="user-service",status=~"5.."}[2m]))
                / sum(rate(http_server_requests_seconds_count{job="user-service"}[2m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
      - uid: user-service-latency
        title: user-service — p95 времени ответа выше 500 мс
        condition: C
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 за 2 минуты: {{ $values.A }} с"
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                histogram_quantile(0.95,
                  sum by (le) (rate(http_server_requests_seconds_bucket{job="user-service",uri!~"/actuator.*"}[2m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
