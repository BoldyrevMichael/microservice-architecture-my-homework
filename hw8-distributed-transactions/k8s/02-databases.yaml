# базы остальных сервисов в том же кластере msa-db (база users создаётся при инициализации)
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: billing
  namespace: msa
spec:
  cluster:
    name: msa-db
  name: billing
  owner: app
