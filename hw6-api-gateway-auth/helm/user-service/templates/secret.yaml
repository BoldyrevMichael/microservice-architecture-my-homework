apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.secretName }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.db.username | quote }}
  password: {{ .Values.db.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-jwt
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ .Values.jwt.secret | quote }}
