apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
---
# защищённые пути: ingress-nginx проверяет токен через /auth/verify и подставляет X-User-Id
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-profile
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:8000/auth/verify
    nginx.ingress.kubernetes.io/auth-response-headers: X-User-Id
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /profile
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
