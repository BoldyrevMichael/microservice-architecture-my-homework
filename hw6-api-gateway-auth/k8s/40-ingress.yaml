apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-service
  namespace: msa
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  name: http
