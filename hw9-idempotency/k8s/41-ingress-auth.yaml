# защищённые пути: ingress-nginx вызывает /auth/verify user-service с заголовком Authorization
# клиента и подставляет в запрос X-User-Id из ответа; сервисы доверяют этому заголовку
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authenticated
  namespace: msa
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://user-service.msa.svc.cluster.local:8000/auth/verify
    nginx.ingress.kubernetes.io/auth-response-headers: X-User-Id
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /profile
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  name: http
          - path: /billing
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port:
                  name: http
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  name: http
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  name: http
          - path: /warehouse
            pathType: Prefix
            backend:
              service:
                name: warehouse-service
                port:
                  name: http
          - path: /delivery
            pathType: Prefix
            backend:
              service:
                name: delivery-service
                port:
                  name: http
